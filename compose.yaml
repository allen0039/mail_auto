name: mail-auto
services:
  app:
    image: allen0039/mail-auto:0.2.1
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - mail-data:/var/lib/mail-auto/data
      - mail-keys:/var/lib/mail-auto/keys
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "/usr/local/bin/mail-auto", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  mail-data:
  mail-keys:
