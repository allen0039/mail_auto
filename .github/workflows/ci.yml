name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: release-verify fixture tests
        run: python3 -m unittest discover -s scripts/release-verify -v

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/mail-auto.oci.tar
      - name: Report runtime image size per platform
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/mail-auto.oci.tar" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          import sys
          import tarfile

          with tarfile.open(sys.argv[1]) as archive:
              def load(path):
                  return json.load(archive.extractfile(path))

              def platform_sizes(index):
                  for entry in index["manifests"]:
                      platform = entry.get("platform", {})
                      architecture = platform.get("architecture")
                      path = "blobs/" + entry["digest"].replace(":", "/")
                      if entry["mediaType"].endswith(("index.v1+json", "manifest.list.v2+json")):
                          yield from platform_sizes(load(path))
                      elif platform.get("os") == "linux" and architecture in {"amd64", "arm64"}:
                          yield architecture, sum(layer["size"] for layer in load(path)["layers"])

              sizes = dict(platform_sizes(load("index.json")))
              if set(sizes) != {"amd64", "arm64"}:
                  sys.exit("runtime image is missing a release platform")
              for architecture, size in sorted(sizes.items()):
                  print(f"- linux/{architecture}: {size:,} bytes of compressed layers")
          PY

  # Admin UI checks (scripts/ui-check) on a throwaway local instance. Development
  # dependencies only: nothing here enters the runtime image (see .dockerignore).
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Chrome for Testing build pinned by puppeteer-core 25.16.0 (package-lock.json).
      CHROME_VERSION: 156.0.8078.47
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
      - name: Install pinned check dependencies
        run: npm ci --prefix scripts/ui-check --no-audit --no-fund
      - name: Install Chrome for Testing ${{ env.CHROME_VERSION }}
        run: |
          cd scripts/ui-check
          path="$(npx --no-install browsers install "chrome@$CHROME_VERSION" --path "$RUNNER_TEMP/browsers" | tail -n 1 | cut -d' ' -f2-)"
          test -x "$path"
          "$path" --version
          echo "CHROME_PATH=$path" >> "$GITHUB_ENV"
          # Ubuntu 24.04 blocks the unprivileged user namespaces Chrome's sandbox
          # needs for a browser outside the system package; allow them on this VM.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: UI checks (settings, model, ownership, task-editor, manual-keep, mail-account at 1280/375/390)
        run: scripts/ui-check/run.sh
      - name: UI gate regression (27 cases, none skipped)
        env:
          PUPPETEER: puppeteer-core
        run: |
          set -o pipefail
          node --test --test-reporter=tap scripts/ui-check/gate-test.cjs | tee "$RUNNER_TEMP/gate.tap"
          grep -qx '# pass 27' "$RUNNER_TEMP/gate.tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/gate.tap"
      - name: No check instance or temporary files left
        if: always()
        run: |
          dirs="$(find "${TMPDIR:-/tmp}" -maxdepth 1 \( -name 'mail-auto-ui-check.*' -o -name 'gate-fixture-*' \) | wc -l)"
          procs="$(pgrep -fc 'mail-auto-ui-check\.' || true)"
          echo "leftover directories=$dirs instance processes=$procs"
          test "$dirs" -eq 0 && test "$procs" -eq 0
